name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
      - name: Unit tests
        run: go test ./... -count=1
      - name: Integration tests (envtest)
        run: make test-integration
      - name: Build image
        run: docker build -t kato:ci .
