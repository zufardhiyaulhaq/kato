image:
  repository: ghcr.io/gopaytech/kato
  tag: "0.8.0"
  pullPolicy: IfNotPresent

# Keep this at 1. kato is a single-process operator: the UseCase/ModelConfig
# caches the REST API reads are populated in-process by their reconcilers, and
# the RunReconciler is a single active executor of externally-created Runs.
# Running >1 replica without leader election + per-controller cache warming would
# serve from empty caches on non-leaders and duplicate run-execution work. HA is
# possible but is a separate change to the operator, not just a replica bump.
replicaCount: 1

config:
  stepTimeout: 30s
  runTTL: 168h        # 7 days
  maxConcurrent: 10
  # Max in-flight direct method runs (POST /api/v1/methods/{name}/run); 429 when
  # full. Independent of maxConcurrent, which bounds the UseCase run path.
  methodMaxConcurrent: 10
  gcInterval: 1h
  # Concurrent execution of externally-created (kubectl/GitOps) Run CRs; separate
  # from maxConcurrent, which bounds the REST API path.
  runReconcileConcurrency: 2
  # A Run stuck in phase=Running longer than this is reaped to Failed by the GC
  # sweep. This force-fails ANY run exceeding it (a healthy long run as well as a
  # crash), so keep it comfortably above your longest expected run.
  runMaxDuration: 1h

# Extra labels/annotations on the POD template only (not the Deployment or the
# other chart objects). This is where sidecar-injection selectors go, since the
# injection webhook reads the pod's labels:
#   podLabels:
#     istio.io/rev: default          # revision-based injection
# or, for the default (non-revisioned) webhook:
#   podLabels:
#     sidecar.istio.io/inject: "true"
#
#   podAnnotations:
#     traffic.sidecar.istio.io/includeOutboundPorts: "16080,16081"
podLabels: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Optionally create an initial ModelConfig and its API-key Secret.
modelConfig:
  enabled: false
  name: default
  default: true
  baseURL: https://api.openai.com/v1
  model: gpt-4o-mini
  maxTokens: 2048
  temperature: "0"
  apiKey: ""          # if set, a Secret is created and referenced

# Example UseCases are shipped under examples/usecases/ for `kubectl apply`;
# the chart does not install them.
