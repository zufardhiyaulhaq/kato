apiVersion: v1
kind: Service
metadata:
  name: {{ include "kato.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kato.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: kato
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
