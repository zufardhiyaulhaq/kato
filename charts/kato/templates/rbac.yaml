apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kato.name" . }}-reader
  labels:
    {{- include "kato.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, nodes, services, events, endpoints, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch]
  # The DB-connectivity checks (read_only_check_postgresql, ping_check_redis)
  # resolve their credentials from a Secret named by the UseCase; a cluster-wide
  # `get` lets that Secret live in any namespace. Get-only and a dedicated rule:
  # kato never lists or watches Secrets.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ["kato.zufardhiyaulhaq.com"]
    resources: [usecases, modelconfigs]
    verbs: [get, list, watch]
  - apiGroups: ["kato.zufardhiyaulhaq.com"]
    resources: [usecases/status, modelconfigs/status]
    verbs: [update, patch]
  - apiGroups: ["kato.zufardhiyaulhaq.com"]
    resources: [runs]
    verbs: [get, list, watch]
  - apiGroups: ["kato.zufardhiyaulhaq.com"]
    resources: [runs/status]
    verbs: [update, patch]
  # check_apiserver reads the API server health endpoints. These are non-resource
  # URLs; granting them explicitly avoids relying on the cluster-default
  # system:public-info-viewer binding (which varies by distro/version).
  - nonResourceURLs: ["/livez", "/healthz"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kato.name" . }}-reader
  labels:
    {{- include "kato.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kato.name" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "kato.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kato.name" . }}-runs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kato.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kato.zufardhiyaulhaq.com"]
    resources: [runs]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: ["kato.zufardhiyaulhaq.com"]
    resources: [runs/status]
    verbs: [update, patch]
  # Secret `get` is granted cluster-wide by the ClusterRole above (DB-check and
  # LLM-key credentials), so no namespaced Secret rule is needed here.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kato.name" . }}-runs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kato.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kato.name" . }}-runs
subjects:
  - kind: ServiceAccount
    name: {{ include "kato.name" . }}
    namespace: {{ .Release.Namespace }}
