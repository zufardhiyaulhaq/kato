# Trigger a run by creating a Run CR directly (kubectl/GitOps) — no API call.
#
# The RunReconciler executes any externally-created Run (one WITHOUT the
# kato.zufardhiyaulhaq.com/managed-by: api label the REST API sets) exactly once,
# then writes the result to this same object's status:
#
#   kubectl apply -f examples/runs/pod-crashloop-run.yaml
#   kubectl get run -n default                          # PHASE: Running -> Succeeded/Failed
#   kubectl get run -n default <name> -o yaml           # per-step outcomes + summary
#
# Requires the referenced UseCase (pod-crashloop) to be applied and Ready first.
# A Run is execute-once and immutable: to re-run, create a new one (generateName
# gives each apply a fresh name). If spec.useCase is missing/not Ready or inputs
# are invalid, the run ends Failed with the reason in status.note.
apiVersion: kato.zufardhiyaulhaq.com/v1alpha1
kind: Run
metadata:
  generateName: pod-crashloop-
  namespace: default
spec:
  useCase: pod-crashloop
  inputs:
    namespace: default
    pod: some-pod
