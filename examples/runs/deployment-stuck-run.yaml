# A Run with a fixed metadata.name — the recommended form: it works with
# `kubectl apply` and you can fetch it by name. Because a Run is execute-once,
# re-applying the same name is a no-op (it won't re-run); delete it first to re-run,
# or use a new name. Requires the deployment-stuck UseCase to be applied and Ready.
apiVersion: kato.zufardhiyaulhaq.com/v1alpha1
kind: Run
metadata:
  name: deployment-stuck-payments
  namespace: default
spec:
  useCase: deployment-stuck
  inputs:
    namespace: default
    deployment: payments
