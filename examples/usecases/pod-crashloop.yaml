apiVersion: kato.zufardhiyaulhaq.com/v1alpha1
kind: UseCase
metadata:
  name: pod-crashloop
spec:
  description: "Diagnose why a pod is crash looping"
  inputs:
    - name: namespace
      required: true
    - name: pod
      required: true
  steps:
    - name: status
      method: check_pod_status
      with:
        namespace: $(inputs.namespace)
        name: $(inputs.pod)
      summaryFilter: [phase, ready, restartCount, nodeName, waitingReason, waitingMessage, lastTerminationReason, lastTerminationExitCode, qosClass]
    - name: events
      method: check_events
      with:
        namespace: $(inputs.namespace)
        involvedObject: $(inputs.pod)
        limit: "10"
        maxLineLength: "200"
      summaryFilter: [events, warningCount]
    - name: previous-logs
      method: check_pod_logs
      when: $(steps.status.restartCount) > 0
      with:
        namespace: $(inputs.namespace)
        name: $(inputs.pod)
        previous: "true"
        tailLines: "20"
        maxLineLength: "200"
      summaryFilter: [logs]
    - name: node
      method: describe_node
      when: $(steps.status.nodeName) != ""
      with:
        name: $(steps.status.nodeName)
      summaryFilter: [conditions, allocatableCPU, allocatableMemory, taints, unschedulable]
  summary:
    prompt: |
      You are a Kubernetes SRE. Based on the evidence, explain why this pod is
      crash looping and suggest a fix.
