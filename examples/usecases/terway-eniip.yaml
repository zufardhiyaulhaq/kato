# Troubleshoot the terway-eniip CNI DaemonSet (Alibaba Cloud Terway, ENIIP mode)
# in kube-system. This UseCase targets a FIXED workload, so it takes no inputs —
# run it with an empty body:
#
#   curl -s -X POST localhost:8080/api/v1/usecases/terway-eniip-daemonset/run \
#     -d '{}' | jq
#
# or by creating a Run CR (kubectl/GitOps). A Run is execute-once: re-applying the
# same name is a no-op, so to re-run, `kubectl delete run <name>` first (or use a
# new name; or generateName + `kubectl create` for a fresh run each time):
#
#   kubectl apply -f - <<'EOF'
#   apiVersion: kato.zufardhiyaulhaq.com/v1alpha1
#   kind: Run
#   metadata: { name: terway-eniip-check, namespace: infrastru }
#   spec: { useCase: terway-eniip-daemonset }
#   EOF
#
apiVersion: kato.zufardhiyaulhaq.com/v1alpha1
kind: UseCase
metadata:
  name: terway-eniip
spec:
  description: "Troubleshoot the terway-eniip CNI DaemonSet in kube-system"
  steps:
    - name: daemonset
      method: check_daemonset_status
      with:
        namespace: kube-system
        name: terway-eniip

    # Scheduling coverage: a CNI must tolerate node taints and target every node.
    # Missing tolerations or a restrictive nodeSelector explain pods missing /
    # NotReady on some nodes.
    - name: daemonset-describe
      method: describe_daemonset
      with:
        namespace: kube-system
        name: terway-eniip
      summaryFilter: [updateStrategy, maxUnavailable, nodeSelector, tolerations]

    - name: events
      method: check_events
      with:
        namespace: kube-system
        involvedObject: terway-eniip
        limit: "5"
        maxLineLength: "200"
      summaryFilter: [events, warningCount]

    - name: eni-config
      method: check_configmap
      with:
        namespace: kube-system
        name: eni-config
        keys: 10-terway.conf
      summaryFilter: [exists, keys, data]

    - name: service-endpoints
      method: check_service_endpoints
      with:
        namespace: kube-system
        name: terway-eniip

    # Active egress probe (run from kato's pod): the CNI's whole job is pod
    # networking, so prove a pod can actually reach the internet. "curl
    # https://google.com" — an HTTPS GET that follows the 301 to www.google.com and
    # expects 200. A failure (success:false / statusCode:0) means egress is broken
    # (ENI/route not programmed, NAT/SNAT gap, or DNS) even if the DaemonSet pods look
    # Ready. Reachability is governed by NetworkPolicy (no RBAC needed).
    - name: egress-google
      method: probe_http
      with:
        target: google.com
        port: "443"
        scheme: https
        path: /
        expectStatus: "200"
        timeout: 5s
      summaryFilter: [success, statusCode, statusMatched, latencyMs, error]

    - name: failing
      method: list_failing_pods
      with:
        namespace: kube-system
        kind: DaemonSet
        name: terway-eniip
        includeNotReady: "true"

    - name: pod-status
      forEach: $(steps.failing.pods)
      maxItems: 1
      when: $(steps.failing.anyFailing)
      method: check_pod_status
      with:
        namespace: $(item.namespace)
        name: $(item.name)

    - name: pod-events
      forEach: $(steps.failing.pods)
      maxItems: 1
      when: $(steps.failing.anyFailing)
      method: check_events
      with:
        namespace: $(item.namespace)
        involvedObject: $(item.name)
        limit: "5"
        maxLineLength: "200"
      summaryFilter: [events, warningCount]

    - name: pod-describe
      forEach: $(steps.failing.pods)
      maxItems: 1
      when: $(steps.failing.anyFailing)
      method: describe_pod
      with:
        namespace: $(item.namespace)
        name: $(item.name)
      summaryFilter: [containers, images, volumes, nodeName, conditions]

    - name: pod-logs
      forEach: $(steps.failing.pods)
      maxItems: 1
      when: $(steps.failing.anyFailing)
      method: check_pod_logs
      with:
        namespace: $(item.namespace)
        name: $(item.name)
        container: terway
        tailLines: "10"
        maxLineLength: "200"
      summaryFilter: [logs]

    - name: pod-previous-logs
      forEach: $(steps.failing.pods)
      maxItems: 1
      when: $(steps.failing.anyFailing)
      method: check_pod_logs
      with:
        namespace: $(item.namespace)
        name: $(item.name)
        container: terway
        previous: "true"
        tailLines: "10"
        maxLineLength: "200"
      summaryFilter: [logs]

    - name: pods
      method: list_pods
      with:
        namespace: kube-system
        kind: DaemonSet
        name: terway-eniip

    - name: pod-resources
      forEach: $(steps.pods.pods)
      maxItems: 1
      method: check_pod_resources
      with:
        namespace: $(item.namespace)
        name: $(item.name)

    - name: pod-usage
      forEach: $(steps.pods.pods)
      maxItems: 2
      method: check_pod_usage
      with:
        namespace: $(item.namespace)
        name: $(item.name)
      summaryFilter: [containers, metricsAvailable]
  summary:
    prompt: |
      Root-cause and fix the terway-eniip CNI DaemonSet (kube-system); if healthy,
      say so and summarize the counts. Watch for: ENI/IP allocation errors
      (IpNotEnough, vSwitch/quota exhausted), OOMKilled/CrashLoopBackOff, a
      missing/malformed eni-config, no ready endpoints, and scheduling gaps (missing
      tolerations / restrictive nodeSelector leaving pods absent or NotReady on some
      nodes).
      Treat the active egress probe as ground truth for whether the CNI delivers
      working pod networking: a failed HTTPS GET to google.com (egress-google
      success=false / statusCode=0) means external egress is broken — ENI/route not
      programmed, NAT/SNAT gap, or DNS — even if the DaemonSet pods report Ready;
      call this out as a primary symptom and reconcile it against the component findings.
      Also flag improper pod resources: no limits set, usage near the memory limit
      (OOM risk), or limits far from actual usage; suggest a right-sized request/limit.
