apiVersion: kato.zufardhiyaulhaq.com/v1alpha1
kind: UseCase
metadata:
  name: pod-pending
spec:
  description: "Diagnose why a pod is stuck Pending"
  inputs:
    - name: namespace
      required: true
    - name: pod
      required: true
  steps:
    - name: status
      method: check_pod_status
      with:
        namespace: $(inputs.namespace)
        name: $(inputs.pod)
      summaryFilter: [phase, ready, restartCount, nodeName, waitingReason, waitingMessage, lastTerminationReason, lastTerminationExitCode, qosClass]
    - name: events
      method: check_events
      with:
        namespace: $(inputs.namespace)
        involvedObject: $(inputs.pod)
        limit: "10"
        maxLineLength: "200"
      summaryFilter: [events, warningCount]
    - name: describe
      method: describe_pod
      with:
        namespace: $(inputs.namespace)
        name: $(inputs.pod)
      summaryFilter: [conditions, nodeName, nodeSelector, tolerations, resourceRequests, priorityClassName]
  summary:
    prompt: |
      Explain why this pod is not being scheduled (resources, taints, affinity,
      unbound PVCs) based on the events and pod spec.
